# Native builds for a tag.
#
# Everything this produces is UNTESTED in the sense RELEASES.md Part 2
# means: CI compiled it, nobody ran it. So it goes to its own
# pre-release tagged -untested-<platform>, never alongside the tested
# web release, and the notes open with the required warning.
#
# Triggered by hand. A tag push should not quietly spend twenty minutes
# of runners before anyone has decided the tag is good.
name: Native builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            arch: x64
          - os: windows-latest
            label: Windows
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          tools/ci-capture.sh "Linux build dependencies" bash -c '
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          '

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # VERSIONING.md Part 4: the version lives in one place. It is not
      # typed into tauri.conf.json or Cargo.toml, which both carry
      # 0.0.0 in the repo; the tag being built is the source of truth
      # and is written in here.
      - name: Stamp the version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          python3 - "$V" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = v
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(re.sub(r'^version = "0\.0\.0"$', f'version = "{v}"', cargo.read_text(), count=1, flags=re.M))
          PY

      # The Tauri CLI directly rather than tauri-apps/tauri-action.
      #
      # The action was only ever running this one command — artifacts
      # are published by upload-artifact below, and no release is cut
      # from here — so it added a layer whose output could not be
      # wrapped. Its failure reported exactly "Command npx [...] failed
      # with exit code 1" and nothing about why, which is the entire
      # problem ci-capture.sh exists to solve.
      - name: Build the desktop bundles
        shell: bash
        run: |
          tools/ci-capture.sh "Desktop build (${{ matrix.label }})" \
            npx --yes @tauri-apps/cli@2 build \
            --bundles ${{ matrix.os == 'ubuntu-22.04' && 'deb,rpm,appimage' || 'msi,nsis' }}

      # RELEASES.md Part 5: <AppName>-<version>-<OS>-<arch>.<ext>, with
      # UNTESTED before the extension (Part 2.2). OS comes straight
      # after the version so GitHub's alphabetical listing groups them.
      - name: Rename for release
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) \
            -print0 | while IFS= read -r -d '' f; do
              ext="${f##*.}"
              cp "$f" "dist/DeepDive-${V}-${{ matrix.label }}-${{ matrix.arch }}-UNTESTED.${ext}"
            done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.arch }}
          path: dist/*

  # Android is its own job rather than a matrix row: it needs a JDK,
  # the SDK and the NDK, four Rust targets, and a generated Gradle
  # project that does not live in the repo.
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 used to be here and failed in
      # 14 seconds, before any of this project's own code ran, and
      # produced no failure annotation at all — so from a machine that
      # cannot reach the log storage hosts there was literally nothing
      # to read. It was doing very little that the runner image does
      # not already provide: ubuntu ships the SDK with ANDROID_HOME
      # set. Done explicitly instead, so a failure here says so.
      - name: Check the Android SDK the runner provides
        shell: bash
        run: |
          tools/ci-capture.sh "Android SDK check" bash -c '
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            HOME_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            if [ -z "$HOME_DIR" ] || [ ! -d "$HOME_DIR" ]; then
              echo "No Android SDK on this runner image."
              exit 1
            fi
            echo "ANDROID_HOME=$HOME_DIR" >> "$GITHUB_ENV"
            echo "--- sdkmanager ---"
            command -v sdkmanager || ls "$HOME_DIR/cmdline-tools"
          '

      - name: Install the NDK
        shell: bash
        run: |
          tools/ci-capture.sh "NDK install" bash -c '
            SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          '

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp the version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          python3 - "$V" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = v
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(re.sub(r'^version = "0\.0\.0"$', f'version = "{v}"', cargo.read_text(), count=1, flags=re.M))
          PY

      # The Gradle project is generated rather than committed, so it
      # cannot go stale against tauri.conf.json.
      - name: Generate the Android project
        shell: bash
        run: tools/ci-capture.sh "android init" npx --yes @tauri-apps/cli@2 android init

      # The generated manifest knows nothing about deepdive://, and the
      # deep-link plugin's config covers desktop only. Without this the
      # APK installs, opens, and can never sign in — Spotify sends the
      # user back and Android finds no handler for the scheme. The
      # script verifies its own work and fails the build if the scheme
      # is not there afterwards.
      - name: Register the OAuth scheme in the Android manifest
        shell: bash
        run: |
          tools/ci-capture.sh "Manifest patch" \
            node tools/android-manifest.mjs src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # Debug, deliberately. An unsigned *release* APK cannot be
      # installed on Android at all — it is rejected before it runs —
      # so "no signing yet" and "release" are incompatible. A debug
      # build is signed with Android's debug key, installs by
      # sideloading, and is exactly as untested either way.
      - name: Build the APK
        shell: bash
        run: |
          tools/ci-capture.sh "APK build" \
            npx --yes @tauri-apps/cli@2 android build --apk --debug

      - name: Rename for release
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          mkdir -p dist
          find src-tauri/gen/android -name '*.apk' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "dist/DeepDive-${V}-Android-universal-debug-UNTESTED.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: dist/*
