# Native test builds.
#
# Everything this produces is UNTESTED in the sense RELEASES.md Part 2
# means: CI compiled it, nobody ran it. So it goes to its own
# pre-release tagged -untested-<platform>, never alongside the tested
# web release, and the notes open with the required warning.
#
# Manual builds cover all platforms. An explicit [native-build] commit
# requests an Android test APK, so a web-only deployment cannot be
# mistaken for an updated installed app. Ordinary pushes skip compilation.
name: Native builds

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 3.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            arch: x64
          - os: windows-latest
            label: Windows
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          tools/ci-capture.sh "Linux build dependencies" bash -c '
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          '

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Manual builds use the requested version. Marked Android builds
      # take BUILD from app.js, so the installed binary and About agree.
      # Validate before stamping and pass inputs as data, not shell code.
      - name: Stamp the version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import json, re, os, pathlib
          app = pathlib.Path("docs/js/app.js").read_text()
          match = re.search(r'export const BUILD = "([^"]+)"', app)
          v = os.environ.get("REQUESTED_VERSION") or (match.group(1) if match else "")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v):
              raise SystemExit("A numeric major.minor.patch version is required")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"BUILD_VERSION={v}\n")
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = v
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(re.sub(r'^version = "0\.0\.0"$', f'version = "{v}"', cargo.read_text(), count=1, flags=re.M))
          PY

      # The Tauri CLI directly rather than tauri-apps/tauri-action.
      #
      # The action was only ever running this one command — artifacts
      # are published by upload-artifact below, and no release is cut
      # from here — so it added a layer whose output could not be
      # wrapped. Its failure reported exactly "Command npx [...] failed
      # with exit code 1" and nothing about why, which is the entire
      # problem ci-capture.sh exists to solve.
      # frontendDist points at dist-native, which is assembled here
      # rather than committed. See tools/stage-native.mjs: pointing it
      # straight at docs/app shipped a page whose scripts and fonts
      # lived one directory up and were not in the bundle at all, so
      # every build was green and every app was blank.
      - name: Stage the web root
        shell: bash
        run: tools/ci-capture.sh "Stage web root" node tools/stage-native.mjs dist-native

      - name: Build the desktop bundles
        shell: bash
        run: |
          tools/ci-capture.sh "Desktop build (${{ matrix.label }})" \
            npx --yes @tauri-apps/cli@2 build \
            --bundles ${{ matrix.os == 'ubuntu-22.04' && 'deb,rpm,appimage' || 'msi,nsis' }}

      # RELEASES.md Part 5: <AppName>-<version>-<OS>-<arch>.<ext>, with
      # UNTESTED before the extension (Part 2.2). OS comes straight
      # after the version so GitHub's alphabetical listing groups them.
      - name: Rename for release
        shell: bash
        run: |
          V="$BUILD_VERSION"
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) \
            -print0 | while IFS= read -r -d '' f; do
              ext="${f##*.}"
              cp "$f" "dist/DeepDive-${V}-${{ matrix.label }}-${{ matrix.arch }}-UNTESTED.${ext}"
            done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ matrix.arch }}
          path: dist/*

  # Android is its own job rather than a matrix row: it needs a JDK,
  # the SDK and the NDK, four Rust targets, and a generated Gradle
  # project that does not live in the repo.
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-build]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate permanent Android signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/ci-capture.sh "Signing preflight" node tools/android-signing.mjs --check

      # android-actions/setup-android@v3 used to be here and failed in
      # 14 seconds, before any of this project's own code ran, and
      # produced no failure annotation at all — so from a machine that
      # cannot reach the log storage hosts there was literally nothing
      # to read. It was doing very little that the runner image does
      # not already provide: ubuntu ships the SDK with ANDROID_HOME
      # set. Done explicitly instead, so a failure here says so.
      - name: Check the Android SDK the runner provides
        shell: bash
        run: |
          tools/ci-capture.sh "Android SDK check" bash -c '
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            HOME_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            if [ -z "$HOME_DIR" ] || [ ! -d "$HOME_DIR" ]; then
              echo "No Android SDK on this runner image."
              exit 1
            fi
            echo "ANDROID_HOME=$HOME_DIR" >> "$GITHUB_ENV"
            echo "--- sdkmanager ---"
            command -v sdkmanager || ls "$HOME_DIR/cmdline-tools"
          '

      - name: Install the NDK
        shell: bash
        run: |
          tools/ci-capture.sh "NDK install" bash -c '
            SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          '

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Stamp the version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import json, re, os, pathlib
          app = pathlib.Path("docs/js/app.js").read_text()
          match = re.search(r'export const BUILD = "([^"]+)"', app)
          v = os.environ.get("REQUESTED_VERSION") or (match.group(1) if match else "")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v):
              raise SystemExit("A numeric major.minor.patch version is required")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"BUILD_VERSION={v}\n")
          conf = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = v
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(re.sub(r'^version = "0\.0\.0"$', f'version = "{v}"', cargo.read_text(), count=1, flags=re.M))
          PY

      # The Gradle project is generated rather than committed, so it
      # cannot go stale against tauri.conf.json.
      # The Tauri CLI as a cargo binary, not through npx, and this is
      # not a style preference — it is the fix for the APK build.
      #
      # `android init` bakes the command that invoked it into the
      # generated Gradle project, so Gradle can call back into the CLI
      # for each Rust target. Invoked through npx, npm sets
      # npm_execpath, the CLI detects npm, and it writes:
      #
      #   npm run -- tauri android android-studio-script --target ...
      #
      # which needs a package.json with a "tauri" script. This repo has
      # no package.json at all and should not grow one: the web app is
      # plain ES modules served statically, with no bundler and no
      # install step, and a package.json carrying devDependencies
      # invites exactly the build pipeline that was deliberately
      # avoided. npm exited 254 and Gradle reported it as a failed
      # :app:rustBuildArm64Debug task, which points at Rust rather
      # than at a missing npm script.
      #
      # Invoked as cargo-tauri, the same code bakes "cargo tauri ..."
      # instead, which depends on nothing but the toolchain already
      # installed above.
      - name: Install the Tauri CLI
        shell: bash
        run: tools/ci-capture.sh "tauri-cli install" cargo install tauri-cli --locked --version "^2.12"

      # Before `android init`, which reads frontendDist.
      - name: Stage the web root
        shell: bash
        run: tools/ci-capture.sh "Stage web root" node tools/stage-native.mjs dist-native

      - name: Generate the Android project
        shell: bash
        run: tools/ci-capture.sh "android init" cargo tauri android init

      - name: Fit the WebView around Android system bars
        shell: bash
        run: |
          tools/ci-capture.sh "Activity installation" \
            node tools/android-activity.mjs src-tauri/gen/android/app/src/main

      # The generated manifest knows nothing about deepdive://, and the
      # deep-link plugin's config covers desktop only. Without this the
      # APK installs, opens, and can never sign in — Spotify sends the
      # user back and Android finds no handler for the scheme. The
      # script verifies its own work and fails the build if the scheme
      # is not there afterwards.
      # `android init` copies the Tauri template's own stock
      # ic_launcher.png into every mipmap folder; it does not derive
      # them from bundle.icon, so the APK ships with the default Tauri
      # icon regardless of what this project's icons are. `tauri icon`
      # regenerates the Android mipmaps from the source image, so it
      # has to run after init, which creates the folders it writes to.
      #
      # The source is 512x512. Tauri asks for 1024x1024 and will scale
      # up, so the launcher icon is correct but softer than it should
      # be until a 1024px master exists.
      - name: Generate the launcher icons
        shell: bash
        run: tools/ci-capture.sh "Icon generation" cargo tauri icon src-tauri/icons/icon.png

      - name: Register the OAuth scheme in the Android manifest
        shell: bash
        run: |
          tools/ci-capture.sh "Manifest patch" \
            node tools/android-manifest.mjs src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # Generated Gradle files are patched each build. Passwords stay in
      # environment variables; missing/invalid secrets fail without fallback.
      - name: Configure permanent release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools/ci-capture.sh "Signing configuration" node tools/android-signing.mjs \
            src-tauri/gen/android/app/build.gradle.kts

      - name: Build the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools/ci-capture.sh "APK build" cargo tauri android build --apk

      - name: Verify the permanent signing certificate and APK identity
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          tools/ci-capture.sh "APK signature verification" node tools/android-verify-signing.mjs \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      - name: Rename for release
        shell: bash
        run: |
          V="$BUILD_VERSION"
          mkdir -p dist
          # Only build/outputs/apk, and only the verified universal release one.
          #
          # This used to search all of gen/android and copy EVERY match
          # onto the same destination name, so the shipped artifact was
          # whichever .apk came last in find order. gen/android also
          # contains app/build/intermediates, which holds unsigned and
          # unaligned intermediate APKs — and an unsigned APK is
          # refused by Android at install time, which is exactly the
          # symptom reported. Nondeterministic besides: the same commit
          # could ship an installable APK one run and not the next.
          SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          APK="$SRC/app-universal-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=APK missing::No APK at $APK"
            echo "What the build actually produced under build/outputs:"
            find src-tauri/gen/android -path '*build/outputs*' -name '*.apk' || true
            exit 1
          fi
          cp "$APK" "dist/DeepDive-${V}-Android-universal-UNTESTED.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: dist/*

      # Releases serve the APK itself. Actions artifacts always download
      # as ZIP archives, which Joseph explicitly does not want to extract.
      - name: Publish the direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/ci-capture.sh "APK publication" bash tools/publish-android.sh

      - name: Remove the temporary signing keystore
        if: always()
        shell: bash
        run: |
          tools/ci-capture.sh "Signing cleanup" bash -c '
            if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
              rm -f -- "$ANDROID_KEYSTORE_PATH"
            fi
          '
