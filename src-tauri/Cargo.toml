[package]
name = "deepdive"
version = "0.0.0"
description = "Find what's missing from your Spotify library"
authors = ["Joseph Luker"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# Android loads a shared library rather than running an executable, so
# the Tauri CLI builds this crate with `cargo build --lib`. Without a
# library target that fails outright ("no library targets found in
# package `deepdive`"), which is what stopped the first APK builds.
#
# The _lib suffix is not cosmetic: on Windows a library target sharing
# the binary's name collides over deepdive.pdb during linking.
[lib]
name = "deepdive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
